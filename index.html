<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny O'Neal</title>
    <link rel="icon" type="image/png" href="JBO Logo.%20green%20background.png">

    <style>
        :root {
            --bg-color: #07090e; /* Deep obsidian Apple/Tesla hardware black */
            --text-color: #f0f3f6; /* Crisp premium silver-white */
            --link-color: #4da6ff; /* Luminous electric blue */
            --border-color: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(22, 27, 34, 0.75); /* Frosted glass panel */
            --subtext-color: #9198a1;
            --badge-bg: rgba(30, 41, 59, 0.6);
            --badge-text: #58a6ff;
            --header-gradient: linear-gradient(135deg, #ffffff 0%, #8b949e 100%);
            --glow-color: rgba(88, 166, 255, 0.15);
        }

        body.light-mode {
            --bg-color: #f8fafc; /* Clean titanium platinum */
            --text-color: #1e293b; /* Deep slate */
            --link-color: #0284c7; /* Vibrant professional blue */
            --border-color: rgba(0, 0, 0, 0.08);
            --card-bg: rgba(255, 255, 255, 0.85);
            --subtext-color: #64748b;
            --badge-bg: rgba(241, 245, 249, 0.9);
            --badge-text: #0284c7;
            --header-gradient: linear-gradient(135deg, #0f172a 100%, #334155 0%);
            --glow-color: rgba(2, 132, 199, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Precision Centered Cursor Glow Element (Desktop / Pointer Only) */
        @media (pointer: fine) {
            #cursor-glow {
                position: fixed;
                top: 0;
                left: 0;
                width: 70px;
                height: 70px;
                transform: translate(-50%, -50%);
                pointer-events: none;
                background: radial-gradient(
                    circle, 
                    rgba(88, 166, 255, 0.35) 0%, 
                    rgba(88, 166, 255, 0.1) 45%, 
                    transparent 80%
                );
                border-radius: 50%;
                z-index: 9999;
                transition: transform 0.05s ease-out;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Lora", serif;
            max-width: 740px;
            margin: 80px auto;
            padding: 0 28px;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.8;
            letter-spacing: -0.01em;
            transition: background-color 0.5s ease, color 0.5s ease;
            animation: keynoteFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes keynoteFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Top Right Theme Toggle Switch */
        .theme-switch-wrapper {
            position: fixed;
            top: 24px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            backdrop-filter: blur(16px);
            z-index: 1000;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .theme-switch-wrapper span {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ea043;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Apple/Tesla Keynote Header */
        header {
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            font-size: 3.2rem;
            font-weight: 700;
            margin: 0 0 14px 0;
            letter-spacing: -0.04em;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #2ea043;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #2ea043;
        }

        h2 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 60px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: var(--text-color);
            opacity: 0.9;
        }

        h3 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        p {
            margin-bottom: 20px;
            color: var(--subtext-color);
        }

        body > p, body > h2 + p {
            color: var(--text-color);
        }

        ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        li {
            margin-bottom: 10px;
            color: var(--subtext-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* High-End Bento Grid Cards */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px var(--glow-color);
            border-color: var(--link-color);
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        .card ul li {
            color: var(--text-color);
        }

        .quote-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .quote-card blockquote {
            margin: 0;
            color: var(--text-color);
            font-style: italic;
        }

        .quote-author {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 0.85rem;
            color: var(--subtext-color);
            text-align: right;
            margin-top: 12px;
            font-weight: 500;
        }

        .book-list-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .podcast-container {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .donate-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            text-align: center;
        }

        .btc-address-box {
            font-family: monospace;
            font-size: 0.85rem;
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            word-break: break-all;
            margin: 14px 0;
            color: var(--text-color);
        }

        .copy-btn {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .copy-btn:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        .analytics-container {
            width: 100%;
            height: 420px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            overflow: hidden;
            margin-top: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        /* Tesla Hardware-Grade Bitcoin Chart Card */
        .btc-chart-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            margin-top: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .chart-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .tf-btn {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .tf-btn:hover, .tf-btn.active {
            background-color: var(--link-color);
            color: #ffffff;
            border-color: var(--link-color);
        }

        .tradingview-widget-container {
            height: 650px;
