<script>
    let lastPrice = 0;

    // Real-time automatic polling ticker
    function fetchLiveBtcPrice() {
        fetch('https://mempool.space/api/v1/prices')
            .then(response => response.json())
            .then(data => {
                if (data && data.USD) {
                    updatePriceDisplay(data.USD);
                }
            })
            .catch(err => {
                // Fallback to CoinGecko if primary is rate-limited
                fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd')
                    .then(res => res.json())
                    .then(cgData => {
                        if (cgData && cgData.bitcoin && cgData.bitcoin.usd) {
                            updatePriceDisplay(cgData.bitcoin.usd);
                        }
                    })
                    .catch(() => {
                        document.getElementById('btc-price').innerText = "Live price unavailable";
                    });
            });
    }

    function updatePriceDisplay(newUsdPrice) {
        const priceElement = document.getElementById('btc-price');
        const formattedPrice = newUsdPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        
        priceElement.innerText = `$${formattedPrice} USD`;

        // Visual flash effect to show it's actively checking and updating in real-time
        if (lastPrice !== 0 && newUsdPrice !== lastPrice) {
            priceElement.style.transition = 'color 0.3s ease';
            priceElement.style.color = newUsdPrice > lastPrice ? '#2ea043' : '#f85149'; // Green up, Red down
            setTimeout(() => {
                priceElement.style.color = '';
            }, 1000);
        }
        lastPrice = newUsdPrice;
    }

    // Fetch immediately on page load
    fetchLiveBtcPrice();

    // Check for updates every 5 seconds
    setInterval(fetchLiveBtcPrice, 5000);

    // Copy Bitcoin Address Function
    function copyBtcAddress() {
        const addressText = document.getElementById('btc-wallet-address').innerText;
        navigator.clipboard.writeText(addressText).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.innerText = 'Copied!';
            setTimeout(() => {
                btn.innerText = 'Copy Address';
            }, 2000);
        });
    }

    // Light/Dark Mode Toggle Script
    const toggleSwitch = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        toggleSwitch.checked = true;
    }

    toggleSwitch.addEventListener('change', function(e) {
        if (e.target.checked) {
            document.body.classList.add('dark-mode');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark-mode');
            localStorage.setItem('theme', 'light');
        }
    });
</script>
