<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny O'Neal | Independent Research & Development</title>
    <style>
        :root {
            /* Timeless, neutral dark-mode adaptive tokens */
            --bg-color: #0b0f17;
            --card-bg: #131822;
            --border-color: #2b3342;
            --text-primary: #e2e8f0;
            --text-bright: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #60a5fa;
            
            /* Professional, highly readable system font stack */
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 48px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 8px 0;
        }

        header p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
            margin: 0;
        }

        main {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex: 1;
        }

        /* Content Cards */
        .content-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .content-card h2 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-bright);
            margin: 0 0 12px 0;
        }

        .content-card p, .content-card ul {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0 0 12px 0;
        }

        .content-card ul {
            padding-left: 20px;
        }

        .content-card li {
            margin-bottom: 8px;
        }

        blockquote {
            margin: 0 0 16px 0;
            padding-left: 16px;
            border-left: 3px solid var(--accent-color);
            color: var(--text-bright);
            font-style: italic;
        }

        /* Unified Donate & Supporters Box */
        .donate-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 28px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .donate-header h3 {
            margin: 0 0 8px 0;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-bright);
        }

        .donate-header p {
            margin: 0 0 20px 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .donate-actions {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px 16px;
            text-align: center;
        }

        .crypto-address {
            margin: 0;
            font-size: 13px;
        }

        .crypto-address code {
            color: var(--accent-color);
            font-family: var(--font-mono);
            font-size: 12px;
            word-break: break-all;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }

        /* Recent Supporters Section Styles */
        .recent-supporters-section h4 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 14px 0;
            color: var(--text-bright);
        }

        #supporters-list {
            font-size: 14px;
        }

        .no-donations {
            color: var(--text-muted);
            font-style: italic;
            font-weight: 400;
            margin: 0;
        }

        .supporters-ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .supporters-ul li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(43, 51, 66, 0.5);
        }

        .supporters-ul li:last-child {
            border-bottom: none;
        }

        .tx-date {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 400;
        }

        footer {
            margin-top: 48px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Site Header -->
    <header>
        <h1>Johnny O
