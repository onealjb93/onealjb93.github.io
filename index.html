<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny O'Neal</title>
    <link rel="icon" type="image/png" href="JBO Logo.%20green%20background.png">

    <style>
        :root {
            --bg-color: #07090e;
            --text-color: #f0f3f6;
            --header-name-color: #ffffff;
            --link-color: #4da6ff;
            --border-color: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(22, 27, 34, 0.75);
            --subtext-color: #9198a1;
            --badge-bg: rgba(30, 41, 59, 0.6);
            --badge-text: #58a6ff;
            --glow-color: rgba(88, 166, 255, 0.15);
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --header-name-color: #0f172a;
            --link-color: #0284c7;
            --border-color: rgba(0, 0, 0, 0.08);
            --card-bg: rgba(255, 255, 255, 0.85);
            --subtext-color: #64748b;
            --badge-bg: rgba(241, 245, 249, 0.9);
            --badge-text: #0284c7;
            --glow-color: rgba(2, 132, 199, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Lora", serif;
            max-width: 740px;
            margin: 80px auto;
            padding: 0 28px;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.8;
            letter-spacing: -0.01em;
            transition: background-color 0.4s ease, color 0.4s ease;
            animation: keynoteFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes keynoteFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fixed Top-Right Corner Switcher */
        .theme-switch-wrapper {
            position: fixed;
            top: 20px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        .theme-switch-wrapper span {
            font-size: 0.75rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ea043;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        header {
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            font-size: 3.4rem;
            font-weight: 700;
            margin: 0 0 14px 0;
            letter-spacing: -0.04em;
            color: var(--header-name-color);
            text-shadow: 0 2px 25px rgba(0,0,0,0.15);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #2ea043;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #2ea043;
        }

        h2 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 60px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: var(--text-color);
            opacity: 0.9;
        }

        h3 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        p {
            margin-bottom: 20px;
            color: var(--subtext-color);
        }

        body > p, body > h2 + p {
            color: var(--text-color);
        }

        ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        li {
            margin-bottom: 10px;
            color: var(--subtext-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px var(--glow-color);
            border-color: var(--link-color);
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        .card ul li {
            color: var(--text-color);
        }

        .quote-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .quote-card blockquote {
            margin: 0;
            color: var(--text-color);
            font-style: italic;
        }
