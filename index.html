<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny O'Neal</title>
    <link rel="icon" type="image/png" href="JBO Logo.%20green%20background.png">
    
    <!-- Umami Analytics Script -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="5062ac5a-8e7c-4aa2-a942-6c7f4ce40108"></script>
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1a1f24;
            --link-color: #0969da;
            --border-color: #d8dee4;
            --card-bg: #ffffff;
            --subtext-color: #57606a;
            --badge-bg: #ddf4ff;
            --badge-text: #0969da;
            --header-gradient: linear-gradient(135deg, #1a1f24 0%, #30363d 100%);
        }

        body.dark-mode {
            --bg-color: #0b0f17;
            --text-color: #e6edf3;
            --link-color: #2f81f7;
            --border-color: #30363d;
            --card-bg: #161b22;
            --subtext-color: #8b949e;
            --badge-bg: #111d2e;
            --badge-text: #58a6ff;
            --header-gradient: linear-gradient(135deg, #ffffff 0%, #8b949e 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 720px;
            margin: 60px auto;
            padding: 0 24px;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.75;
            letter-spacing: -0.01em;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism Top Right Theme Toggle Switch */
        .theme-switch-wrapper {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        .theme-switch-wrapper span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--subtext-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ea043;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Cutting-Edge Clean Header */
        header {
            margin-bottom: 45px;
        }

        h1 {
            font-size: 2.7rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.04em;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.83rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ea043;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #2ea043;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 50px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            letter-spacing: -0.02em;
            color: var(--text-color);
        }

        h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        p {
            margin-bottom: 16px;
            color: var(--subtext-color);
        }

        body > p, body > h2 + p {
            color: var(--text-color);
        }

        ul {
            padding-left: 20px;
            margin-top: 6px;
        }

        li {
            margin-bottom: 8px;
            color: var(--subtext-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        /* Modern Bento Grid Cards */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            border-color: var(--link-color);
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--text-color);
        }

        .card ul li {
            color: var(--text-color);
        }

        .quote-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            background-color: var(--card-bg);
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .quote-card blockquote {
            margin: 0;
            color: var(--text-color);
            font-style: italic;
        }

        .quote-author {
            font-size: 0.85rem;
            color: var(--subtext-color);
            text-align: right;
            margin-top: 8px;
            font-weight: 500;
        }

        .book-list-container {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .podcast-container {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .donate-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .btc-address-box {
            font-family: monospace;
            font-size: 0.85rem;
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            word-break: break-all;
            margin: 12px 0;
            color: var(--text-color);
            transition: background-color 0.3s ease;
        }

        .copy-btn {
            background-color: var(--link-color);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .copy-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .analytics-container {
            width: 100%;
            height: 420px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Pulsing Live Indicator for Bitcoin Ticker */
        .live-pulse {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #2ea043;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse-animation 2s infinite;
        }

            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 160, 67, 0); }
