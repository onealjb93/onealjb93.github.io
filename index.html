<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny O'Neal</title>
    <link rel="icon" type="image/png" href="JBO Logo.%20green%20background.png">

    <script defer src="https://cloud.umami.is/script.js" data-website-id="5062ac5a-8e7c-4aa2-a942-6c7f4ce40108"></script>
    
    <style>
        :root {
            --bg-color: #fcfbf9; /* Warm editorial parchment */
            --text-color: #2c3e50; /* Deep charcoal */
            --link-color: #1b4f72; /* Deep classic navy accent */
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --subtext-color: #555b6e;
            --badge-bg: #f0f4f8;
            --badge-text: #1b4f72;
            --header-gradient: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        }

        body.dark-mode {
            --bg-color: #0d1117; /* Rich midnight obsidian */
            --text-color: #e1e4e8; /* Soft warm white */
            --link-color: #58a6ff; /* Clean luminous blue */
            --border-color: #30363d;
            --card-bg: #161b22;
            --subtext-color: #8b949e;
            --badge-bg: #111d2e;
            --badge-text: #58a6ff;
            --header-gradient: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
        }

        * {
            box-sizing: border-box;
        }

        /* Weighted Gravitational Indentation Cursor Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(
                45px circle at var(--x, 50%) var(--y, 50%), 
                rgba(0, 0, 0, 0.22) 0%, 
                rgba(0, 0, 0, 0.08) 35%, 
                rgba(27, 79, 114, 0.03) 65%, 
                transparent 90%
            );
            z-index: 9999;
            transition: background 0.01s ease-out;
        }

        body.dark-mode::before {
            background: radial-gradient(
                45px circle at var(--x, 50%) var(--y, 50%), 
                rgba(255, 255, 255, 0.16) 0%, 
                rgba(255, 255, 255, 0.06) 35%, 
                rgba(88, 166, 255, 0.04) 65%, 
                transparent 90%
            );
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Lora", "Georgia", "Inter", serif;
            max-width: 700px;
            margin: 70px auto;
            padding: 0 24px;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.8;
            letter-spacing: -0.003em;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Glassmorphism Top Right Theme Toggle Switch */
        .theme-switch-wrapper {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            backdrop-filter: blur(12px);
            z-index: 1000;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .theme-switch-wrapper span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--subtext-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ea043;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Clean, Timeless Header */
        header {
            margin-bottom: 50px;
        }

        h1 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -0.03em;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.83rem;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            border: 1px solid var(--border-color);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #2ea043;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #2ea043;
        }

        h2 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 55px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        h3 {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        p {
            margin-bottom: 18px;
            color: var(--subtext-color);
        }

        body > p, body > h2 + p {
            color: var(--text-color);
        }

        ul {
            padding-left: 20px;
            margin-top: 6px;
        }

        li {
            margin-bottom: 8px;
            color: var(--subtext-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* Modern Bento Grid Cards */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border-color: var(--link-color);
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--text-color);
        }

        .card ul li {
            color: var(--text-color);
        }

        .quote-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .quote-card blockquote {
            margin: 0;
            color: var(--text-color);
            font-style: italic;
        }

        .quote-author {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            font-size: 0.85rem;
            color: var(--subtext-color);
            text-align: right;
            margin-top: 10px;
            font-weight: 500;
        }

        .book-list-container {
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .podcast-container {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .donate-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            text-align: center;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .btc-address-box {
            font-family: monospace;
            font-size: 0.85rem;
            background: var(--bg-color);
            border: 1px dashed var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            word-break: break-all;
            margin: 12px 0;
            color: var(--text-color);
            transition: background-color 0.4s ease;
        }

            font-family: -apple-system, BlinkMacSystemFont
