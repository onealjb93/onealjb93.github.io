<meta name="description" content="The tower is a stack of lit neighbourhoods pretending to be a needle. Section rises on section of polished glass and pale metal from a terraced town on the fjord shore — a glass-domed hall on the waterfront, red-and-white market canopies along the promenade, crowds on every level — and the whole impossible height of it is doubled in the still water, while two people walk a dog along the near quay as if it were any morning anywhere.">
