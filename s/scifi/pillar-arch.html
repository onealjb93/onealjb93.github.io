<meta name="robots" content="noindex">
<meta name="description" content="The pillars were already impossible — thousands of stone towers rising out of the dawn mist in Zhangjiajie, forest clinging to every ledge. The arch simply believes them. A twin-arched building of pale stone spans from pillar top to pillar top high above the gorge, trees planted along its crown, two rows of windows glowing amber in the first light, and the morning mist pours through both arches as if the building were just another piece of the weather.">
