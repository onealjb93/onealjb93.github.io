<meta name="robots" content="noindex">
<meta name="description" content="The town is a staircase that leans out over the water. Terrace after terrace of glass and timber cantilevers from the forested bank above a green fjord river, trees growing out of every level and the morning crowd spread across all of them — a market on the lowest deck, a class moving through its forms in the sun — while one dark tower rises behind, taller than the fjord walls themselves.">
