<meta name="robots" content="noindex">
<meta name="description" content="Everyone knows this view — El Capitan standing guard on the left, Bridalveil Fall pouring down the right with a rainbow standing in its mist, the pine forest running unbroken to the valley&#x27;s mouth. What the view has now is a gate. Far away, where the valley opens, a single luminous arch spans from wall to wall, its crown carrying gardens and a thread of moving light, its windows lit in small warm clusters — the whole structure softened by the same blue haze that softens the domes behind it.">
