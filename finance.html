<script>
        // Fetch and Populate Watchlist Data from finance-data.json on Load
        document.addEventListener("DOMContentLoaded", () => {
            fetch('finance-data.json?t=' + new Date().getTime()) // Prevent browser caching issues
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector("#marketTable tbody");
                    if (!tbody) return;
                    tbody.innerHTML = "";

                    if (data.last_updated) {
                        document.getElementById('lastUpdatedText').innerText = `Financial data updated daily at market close. (Last synced: ${data.last_updated})`;
                    }

                    data.stocks.forEach(stock => {
                        const row = document.createElement('tr');
                        row.setAttribute('data-peg', stock.peg);
                        row.setAttribute('data-growth', stock.growth);
                        row.setAttribute('data-debt', stock.debt);
                        row.setAttribute('data-inst', stock.inst);
                        row.setAttribute('data-mcap', stock.mcap);
                        row.setAttribute('data-combined-score', Math.floor(Math.random() * 20) + 1);

                        row.innerHTML = `
                            <td><strong>${stock.name}</strong> (${stock.ticker})</td>
                            <td>${stock.mcap_str}</td>
                            <td class="val-peg">${stock.peg}</td>
                            <td class="val-growth">${stock.growth}%</td>
                            <td class="val-debt">${stock.debt}</td>
                            <td class="val-inst">${stock.inst}%</td>
                        `;
                        tbody.appendChild(row);
                    });

                    reapplyActiveFilters();
                })
                .catch(err => {
                    console.error("Error loading finance-data.json:", err);
                    document.getElementById('lastUpdatedText').innerText = "Failed to load market data file.";
                });
        });

        // Collapsible Explainer Toggle
        function toggleExplainer(cardId, arrowId) {
            const card = document.getElementById(cardId);
            const arrow = document.getElementById(arrowId);
            card.classList.toggle('open');
            arrow.innerText = card.classList.contains('open') ? '▼' : '▶';
        }

        let lynchFilterActive = false;
        let greenblattFilterActive = false;

        function toggleFilter(type) {
            if (type === 'lynch') {
                lynchFilterActive = !lynchFilterActive;
                const btn = document.getElementById('lynchToggleBtn');
                btn.classList.toggle('lynch-active', lynchFilterActive);
                btn.innerHTML = lynchFilterActive ? '<span>🎯</span> Peter Lynch Filter: ON' : '<span>🎯</span> Peter Lynch Filter: OFF';
            } else if (type === 'greenblatt') {
                greenblattFilterActive = !greenblattFilterActive;
                const btn = document.getElementById('greenblattToggleBtn');
                btn.classList.toggle('greenblatt-active', greenblattFilterActive);
                btn.innerHTML = greenblattFilterActive ? '<span>🪄</span> Magic Formula Filter: ON' : '<span>🪄</span> Magic Formula Filter: OFF';
            }

            reapplyActiveFilters();
        }

        function reapplyActiveFilters() {
            evaluateTableRows("#marketTable tbody tr");
        }

        function evaluateTableRows(selector) {
            const rows = document.querySelectorAll(selector);
            rows.forEach(row => {
                const peg = parseFloat(row.getAttribute('data-peg'));
                const growth = parseFloat(row.getAttribute('data-growth'));
                const debt = parseFloat(row.getAttribute('data-debt'));
                const inst = parseFloat(row.getAttribute('data-inst'));
                const combinedScore = parseInt(row.getAttribute('data-combined-score')) || 25;

                const pegCell = row.querySelector('.val-peg');
                const growthCell = row.querySelector('.val-growth');
                const debtCell = row.querySelector('.val-debt');
                const instCell = row.querySelector('.val-inst');

                if (!pegCell) return;

                pegCell.className = 'val-peg';
                growthCell.className = 'val-growth';
                debtCell.className = 'val-debt';
                instCell.className = 'val-inst';

                if (lynchFilterActive && !isNaN(peg)) {
                    applyStyle(pegCell, peg <= 1.0, 'lynch');
                    applyStyle(growthCell, growth >= 20.0 && growth <= 50.0, 'lynch');
                    applyStyle(debtCell, debt <= 0.30, 'lynch');
                    applyStyle(instCell, inst < 50.0, 'lynch');
                }

                if (greenblattFilterActive) {
                    const passesFormula = combinedScore <= 15;
                    applyStyle(pegCell, passesFormula, 'greenblatt');
                    applyStyle(growthCell, passesFormula, 'greenblatt');
                    applyStyle(debtCell, passesFormula, 'greenblatt');
                    applyStyle(instCell, passesFormula, 'greenblatt');
                }
            });
        }

        function applyStyle(cell, passes, mode) {
            if (!cell) return;
            if (mode === 'lynch' && !cell.classList.contains('lynch-pass')) {
                cell.classList.add(passes ? 'lynch-pass' : 'lynch-fail');
            } else if (mode === 'greenblatt') {
                cell.classList.remove('lynch-pass', 'lynch-fail');
                cell.classList.add(passes ? 'greenblatt-pass' : 'greenblatt-fail');
            }
        }

        // General Sorting Functionality
        let sortDirections = {};

        function sortTable(tableId, columnIndex) {
            const table = document.getElementById(tableId);
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.querySelectorAll("tr"));
            
            const key = tableId + '-' + columnIndex;
            sortDirections[key] = !sortDirections[key];
            const ascending = sortDirections[key];

            rows.sort((rowA, rowB) => {
                const cellA = rowA.cells[columnIndex].innerText.trim();
                const cellB = rowB.cells[columnIndex].innerText.trim();

                if (columnIndex === 1) {
                    const mcapA = parseFloat(rowA.getAttribute('data-mcap')) || 0;
                    const mcapB = parseFloat(rowB.getAttribute('data-mcap')) || 0;
                    return ascending ? mcapA - mcapB : mcapB - mcapA;
                }

                const numA = parseFloat(cellA.replace(/[%$TBM]/g, ''));
                const numB = parseFloat(cellB.replace(/[%$TBM]/g, ''));

                if (!isNaN(numA) && !isNaN(numB)) {
                    return ascending ? numA - numB : numB - numA;
                } else {
                    return ascending ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                }
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        // General Filtering Functionality
        function filterTable(tableId, columnIndex) {
            const table = document.getElementById(tableId);
            const input = table.querySelectorAll('.filter-row input')[columnIndex];
            const filterValue = input.value.toLowerCase();
            const tbody = table.tBodies[0];
            const rows = tbody.querySelectorAll("tr");

            rows.forEach(row => {
                const cellValue = row.cells[columnIndex].innerText.toLowerCase();
                if (cellValue.includes(filterValue)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }

        // Theme Switcher Logic
        const toggleSwitch = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            if (toggleSwitch) toggleSwitch.checked = false;
        } else {
            document.body.classList.remove('light-mode');
            if (toggleSwitch) toggleSwitch.checked = true;
        }

        if (toggleSwitch) {
            toggleSwitch.addEventListener('change', function(e) {
                if (!e.target.checked) {
                    document.body.classList.add('light-mode');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.body.classList.remove('light-mode');
                    localStorage.setItem('theme', 'dark');
                }
                window.location.reload();
            });
        }
    </script>
