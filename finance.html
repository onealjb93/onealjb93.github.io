<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Markets - Johnny O'Neal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --subtext-color: #9ca3af;
            --border-color: #1f2937;
            --card-bg: #111827;
            --table-hover: #1f2937;
            --link-color: #3b82f6;
            --lynch-bg: rgba(59, 130, 246, 0.15);
            --lynch-text: #60a5fa;
            --greenblatt-bg: rgba(16, 185, 129, 0.15);
            --greenblatt-text: #34d399;
            --buffett-bg: rgba(245, 158, 11, 0.15);
            --buffett-text: #fbbf24;
            --thiel-bg: rgba(168, 85, 247, 0.15);
            --thiel-text: #c084fc;
            --ives-bg: rgba(236, 72, 153, 0.15);
            --ives-text: #f472b6;
            --druck-bg: rgba(219, 39, 119, 0.15);
            --druck-text: #f43f5e;
            --simons-bg: rgba(2, 132, 199, 0.15);
            --simons-text: #38bdf8;
            --pass-bg: rgba(34, 197, 94, 0.2);
            --pass-text: #4ade80;
            --fail-bg: rgba(239, 68, 68, 0.2);
            --fail-text: #f87171;
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #111111;
            --subtext-color: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #f9fafb;
            --table-hover: #f3f4f6;
            --link-color: #2563eb;
            --lynch-bg: rgba(37, 99, 235, 0.1);
            --lynch-text: #1d4ed8;
            --greenblatt-bg: rgba(5, 150, 105, 0.1);
            --greenblatt-text: #047857;
            --buffett-bg: rgba(217, 119, 6, 0.1);
            --buffett-text: #b45309;
            --thiel-bg: rgba(147, 51, 234, 0.1);
            --thiel-text: #7e22ce;
            --ives-bg: rgba(219, 39, 119, 0.1);
            --ives-text: #be185d;
            --druck-bg: rgba(190, 24, 93, 0.1);
            --druck-text: #9d174d;
            --simons-bg: rgba(3, 105, 161, 0.1);
            --simons-text: #0369a1;
            --pass-bg: rgba(22, 163, 74, 0.15);
            --pass-text: #15803d;
            --fail-bg: rgba(220, 38, 38, 0.15);
            --fail-text: #b91c1c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 1380px;
            margin: 80px auto;
            padding: 0 28px;
            line-height: 1.5;
            transition: background-color 0.2s, color 0.2s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.25rem; }
        p.subtitle { color: var(--subtext-color); font-size: 1rem; }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .theme-toggle-btn:hover { border-color: var(--link-color); }

        .back-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        .back-link:hover { text-decoration: underline; }

        .section-title { font-size: 1.35rem; font-weight: 600; margin-bottom: 1rem; }

        /* Explainer Accordions */
        .explainer-wrapper {
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            overflow: hidden;
        }
        .info-toggle {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-color);
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .info-toggle:hover { background-color: var(--table-hover); }
        .explainer-card {
            display: none;
            padding: 1rem 1.25rem 1.25rem 1.25rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--subtext-color);
        }
        .explainer-card.active { display: block; }
        .explainer-card h3 { color: var(--text-color); font-size: 0.95rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
        
        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-top: 0.75rem;
        }
        .rule-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
        }
        .rule-item strong { color: var(--text-color); font-size: 0.82rem; display: block; margin-bottom: 0.2rem; }
        .rule-item p { margin: 0 0 0.4rem 0; font-size: 0.78rem; }
        .range-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--pass-bg);
            color: var(--pass-text);
        }

        /* Strategy Toolbar / Buttons */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .filter-btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .strategy-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }
        .strategy-btn:hover { border-color: var(--link-color); }
        
        .strategy-btn.lynch-active { background-color: var(--lynch-text); color: #ffffff; border-color: var(--lynch-text); }
        .strategy-btn.greenblatt-active { background-color: var(--greenblatt-text); color: #ffffff; border-color: var(--greenblatt-text); }
        .strategy-btn.buffett-active { background-color: var(--buffett-text); color: #111111; border-color: var(--buffett-text); }
        .strategy-btn.thiel-active { background-color: var(--thiel-text); color: #ffffff; border-color: var(--thiel-text); }
        .strategy-btn.ives-active { background-color: var(--ives-text); color: #ffffff; border-color: var(--ives-text); }
        .strategy-btn.druck-active { background-color: var(--druck-text); color: #ffffff; border-color: var(--druck-text); }
        .strategy-btn.simons-active { background-color: var(--simons-text); color: #ffffff; border-color: var(--simons-text); }

        /* Spreadsheet Container & Table */
        .spreadsheet-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 3rem;
        }
