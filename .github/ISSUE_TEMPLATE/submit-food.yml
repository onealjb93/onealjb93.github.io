name: Submit a food to the Pantry
description: Share a store-bought food for Johnny's Pantry — attach a photo and it will be reviewed for the website.
title: "[Pantry] "
labels: ["pantry-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the Pantry! Attach a clear photo of the food and fill in what you know.
        Nothing goes on the website automatically — every submission is reviewed first.
  - type: textarea
    id: photo
    attributes:
      label: "Food photo"
      description: "Drag and drop a photo of the food's front into this box (or click and paste one). If you can, add a second photo of the nutrition label on the back — that makes the Pantry entry exact."
      placeholder: "Drop your photo(s) here…"
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: "What is it?"
      description: "Brand + product name, if you know it. Leave blank if the photo says it all."
      placeholder: "e.g. Wellshire Smoked Fresh Turkey Kielbasa"
    validations:
      required: false
  - type: input
    id: where
    attributes:
      label: "Where did you find it?"
      description: "The store or market where you got it."
      placeholder: "e.g. Whole Foods, Wade Ave"
    validations:
      required: false
  - type: dropdown
    id: publish
    attributes:
      label: "Okay to publish?"
      description: "Public submissions may be shown in the Pantry on johnny-oneal.com. Private ones go only into Johnny's personal archive and are never posted."
      options:
        - "Public — okay to show on the website"
        - "Private — just for Johnny's archive"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Anything else?"
      description: "Price, how it tastes, how you cook with it — anything worth noting."
    validations:
      required: false
