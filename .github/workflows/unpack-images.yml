name: unpack-images
on:
  push:
    paths:
      - .github/workflows/unpack-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p images
          tar -xzf images-batch.tar.gz -C images
          rm images-batch.tar.gz
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Recipes: card photos extracted into images/"
          git push
