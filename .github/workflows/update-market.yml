name: Daily Financial Data Update

on:
  schedule:
    - cron: '0 22 * * 1-5' # Runs Monday through Friday at 10:00 PM UTC
  workflow_dispatch: # Allows you to manually trigger it anytime from the GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Sync scoreboard add/remove requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_scoreboard_requests.py

      - name: Run updater script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python update_finance.py

      - name: Run Bitcoin golden-state updater
        run: python update_btc_state.py

      - name: Run history updater (backtest data)
  # No key needed: Yahoo Finance v8 chart API. If any series fails,
  # the script exits non-zero, the previous finance-history.json
  # stays in place, and the run fails loudly (no continue-on-error:
  # a builder failure must turn the run red — pipeline audit W1).
        run: python fetch_history.py

      - name: Run chart data updater (The Chart)
        run: python fetch_chart_data.py

  # Dilution & Buybacks data (2026-11-28): per-ticker share-count
  # steps from SEC EDGAR filings (build_shares_data.py reads the
  # chart file above for the universe and the previous
  # dilution-data.json for its incremental filing watermark; a
  # failed ticker keeps its previous entry). continue-on-error is
  # deliberate: a share-count failure must never block the market
  # data pipeline — the previous dilution-data.json stays live and
  # the failure shows in this run's log.
      - name: Run share-count builder (Dilution & Buybacks)
        continue-on-error: true
        run: python build_shares_data.py

      - name: Run share-stub refresher
        run: python update_share_stubs.py

  # Step 2 of the automation (Johnny, 2026-11-24): verify the
  # freshly built data BEFORE anything is committed. The suite
  # recomputes every score and band dot from the built closes,
  # cross-checks headline closes against independent sources
  # (FRED, Coinbase, Nasdaq), checks the through date against
  # the market calendar, and checks the fine rungs against the
  # daily file. No continue-on-error: a failed verify fails
  # the run, the commit step below never runs, and yesterday's
  # verified data stays live.
      - name: Verify built data (correctness gate)
        run: python verify_market_data.py

      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add finance-data.json finance-history.json finance-chart-data.json finance-chart-daily.json dilution-data.json finance-intraday.json finance-chart-first.json btc-state.json s og-recipes.jpg og-sustainability.jpg og-random.jpg share-refresh-state.json grades-history.json og-bitcoin.jpg og-finance.jpg scoreboard-stocks.json fine30 fine60 fine15 fine5 verification-report.json
          git add finance-context.json insider-purchases.json || true
          git add og-finance-*.jpg || true
          git commit -m "Automated daily financial data refresh via API [skip ci]" || exit 0
          git pull --rebase origin main
          git push
