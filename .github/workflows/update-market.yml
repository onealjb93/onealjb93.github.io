name: Daily Financial Data Update

on:
  schedule:
    - cron: '0 22 * * 1-5' # Runs Monday through Friday at 10:00 PM UTC
  workflow_dispatch: # Allows you to manually trigger it anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Run updater script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python update_finance.py

      - name: Run Bitcoin golden-state updater
        continue-on-error: true
        run: python update_btc_state.py
        
      - name: Run history updater (backtest data)
  # No key needed: Yahoo Finance v8 chart API. If any series fails,
  # the script exits non-zero and the previous finance-history.json
  # stays in place; continue-on-error keeps the finance-data commit.
        continue-on-error: true
        run: python fetch_history.py

      - name: Run chart data updater (The Chart)
        continue-on-error: true
        run: python fetch_chart_data.py
        
      - name: Run share-stub refresher
        continue-on-error: true
        run: python update_share_stubs.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add finance-data.json finance-history.json finance-chart-data.json finance-chart-daily.json btc-state.json s og-recipes.jpg og-sustainability.jpg og-random.jpg share-refresh-state.json grades-history.json og-bitcoin.jpg og-finance.jpg
          git add og-finance-*.jpg || true
          git commit -m "Automated daily financial data refresh via API [skip ci]" || exit 0
          git pull --rebase origin main
          git push
