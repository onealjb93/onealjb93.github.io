name: Daily Financial Data Update

on:
  schedule:
    - cron: '0 22 * * 1-5' # Runs Monday through Friday at 10:00 PM UTC
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run updater script
        run: python update_finance.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add finance-data.json
          git commit -m "Automated daily financial data refresh [skip ci]" || exit 0
          git push
