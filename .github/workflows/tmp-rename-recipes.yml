name: tmp-rename-recipes
on: workflow_dispatch
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename staged recipes file
        run: |
          git config user.name "onealjb93"
          git config user.email "onealjb93@users.noreply.github.com"
          mv recipes-toggle-stage.html recipes.html
          git add recipes.html recipes-toggle-stage.html
          git commit -m "Recipes: Add quantities button - clean instructions by default"
          git push
