name: tmp-rename-recipes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename staged recipes file into place
        run: |
          mv recipes-staged.html recipes.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recipe credits: 27 cards name their books; nutrition tool card shows the comparison"
          git push
