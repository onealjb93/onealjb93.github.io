name: tmp-rename-recipes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename staged recipes file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv recipes-new.html recipes.html
          git add -A
          git commit -m "Recipes: instruction quantities follow the selected dish size; nutrition pill rides in the selection tray"
          git push
