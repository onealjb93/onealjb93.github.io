name: swap-briefings
on:
  push:
    paths:
      - .github/workflows/swap-briefings.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p images
          mv oatmeal.jpg images/oatmeal.jpg
          mv recipes-briefings-upload.html recipes.html
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Recipes: custom health briefings on all 101 recipes; oatmeal card photo"
          git push
